name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, feat/ci]
  # pull_request:
  #   branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: "18"
  NODE_ENV: "test"

jobs:
  # Separate job for fast feedback on code quality
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate cache key
        id: cache-key
        run: echo "key=${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache build artifacts
        uses: actions/cache@v3
        with:
          path: .next
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Run linting
        run: npm run lint:check

      - name: Run type checking
        run: npm run type-check

      - name: Build application
        run: npm run build

      # Cache the built application for other jobs
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: |
            .next/
            package.json
            package-lock.json
          retention-days: 1
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: code-quality

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_USER: testuser
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 30s
          --health-timeout 10s
          --health-retries 3
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files

      - name: Create test environment
        run: |
          cat > .env.test << EOF
          DATABASE_URL=postgresql://testuser:testpass@localhost:5432/testdb
          POSTGRES_DATABASE=testdb
          POSTGRES_USER=testuser
          POSTGRES_PASSWORD=testpass
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          PORT=3000
          BASE_URL=http://127.0.0.1:3000
          NODE_ENV=test
          EOF

      - name: Run database migrations
        run: npm run migration:up
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
      - name: Build application
        run: npm run build
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          POSTGRES_DATABASE: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432

      - name: Start application and run integration tests
        run: |
          # Start application in background with explicit test environment
          npm run dev:test &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> $GITHUB_ENV

          # Function to cleanup on exit
          cleanup() {
            echo "Cleaning up application (PID: $APP_PID)"
            kill $APP_PID 2>/dev/null || true
            wait $APP_PID 2>/dev/null || true
          }
          trap cleanup EXIT

          # Wait for application to be ready
          echo "Waiting for application to start..."
          for i in {1..30}; do
            if curl -f -s http://127.0.0.1:3000/api/v1/status > /dev/null 2>&1; then
              echo "Application is ready after $i attempts"
              break
            fi
            echo "Attempt $i: Application not ready yet, waiting 2 seconds..."
            sleep 2
            if [ $i -eq 30 ]; then
              echo "Application failed to start within 60 seconds"
              exit 1
            fi
          done

          # Verify NODE_ENV is correctly set
          echo $NODE_ENV
          echo "Verifying application environment..."
          curl -s http://127.0.0.1:3000/api/v1/status | grep -q test || echo "Warning: NODE_ENV might not be test"

          # Run integration tests
          echo "Running integration tests..."
          npm run test:integration
        env:
          NODE_ENV: ${{ env.NODE_ENV }}
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          POSTGRES_DATABASE: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          BASE_URL: http://127.0.0.1:3000

      # Add a brief pause to ensure the application is fully ready
      - name: Wait for application stability
        run: |
          echo "Waiting for application to stabilize..."
          sleep 5
          # Final connectivity test
          curl -f http://127.0.0.1:3000/api/v1/status
          echo "Application is stable and ready for tests"

      # Test the migration endpoint directly
      - name: Test migration endpoints directly
        run: |
          echo "=== Testing GET /api/v1/migrations ==="
          curl -v http://127.0.0.1:3000/api/v1/migrations || echo "GET failed"
          echo ""
          echo "=== Testing POST /api/v1/migrations ==="
          curl -v -X POST http://127.0.0.1:3000/api/v1/migrations || echo "POST failed"

      - name: Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          POSTGRES_DATABASE: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          BASE_URL: http://127.0.0.1:3000
          NODE_ENV: test

      - name: Stop application
        run: |
          if [ ! -z "$APP_PID" ]; then
            echo "Stopping application with PID: $APP_PID"
            kill $APP_PID || echo "Process already stopped"
            sleep 2
            kill -9 $APP_PID 2>/dev/null || echo "Process already terminated"
          fi
        if: always()

      # Show logs if tests fail
      - name: Show application logs on failure
        if: failure()
        run: |
          echo "=== Checking if application is still running ==="
          ps aux | grep node || echo "No node processes found"
          echo "=== Checking port 3000 ==="
          netstat -tlnp | grep 3000 || echo "Port 3000 not in use"
          echo "=== Recent system logs ==="
          journalctl --since "5 minutes ago" | tail -50 || echo "No recent logs found"
