name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, feat/ci]
  # pull_request:
  #   branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_USER: testuser
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create test environment
        run: |
          cat > .env.test << EOF
          DATABASE_URL=postgresql://testuser:testpass@localhost:5432/testdb
          POSTGRES_DATABASE=testdb
          POSTGRES_USER=testuser
          POSTGRES_PASSWORD=testpass
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          PORT=3000
          BASE_URL=http://127.0.0.1:3000
          NODE_ENV=test
          JWT_SECRET=test-secret
          EOF

      # - name: Run linting
      # run: npm run lint

      - name: Run type checking
        run: npm run type-check

      # - name: Run unit tests
      # run: npm run test:unit

      - name: Build application
        run: npm run build

      - name: Run database migrations
        run: npm run migration:up
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb

      # SOLUTION 1: Improved startup with better health checking
      - name: Start application for integration tests
        run: |
          # Start the application in background
          npm start &
          APP_PID=$!
          echo $APP_PID > app.pid
          echo "Started application with PID: $APP_PID"

          # More robust health check with retries and better error handling
          echo "Waiting for application to be ready..."
          for i in {1..30}; do
            if curl -f -s http://127.0.0.1:3000/api/v1/status > /dev/null 2>&1; then
              echo "Application is ready after $i attempts"
              break
            fi
            echo "Attempt $i: Application not ready yet, waiting 2 seconds..."
            sleep 2
            if [ $i -eq 30 ]; then
              echo "Application failed to start within 60 seconds"
              # Show application logs for debugging
              echo "=== Application logs ==="
              ps aux | grep node
              netstat -tlnp | grep 3000 || echo "Port 3000 not listening"
              exit 1
            fi
          done

          # Additional verification
          echo "Final health check..."
          curl -v http://127.0.0.1:3000/api/v1/status || exit 1
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          POSTGRES_DATABASE: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          BASE_URL: http://127.0.0.1:3000
          NODE_ENV: test

      # Add a brief pause to ensure the application is fully ready
      - name: Wait for application stability
        run: |
          echo "Waiting for application to stabilize..."
          sleep 5
          # Final connectivity test
          curl -f http://127.0.0.1:3000/api/v1/status
          echo "Application is stable and ready for tests"

      # Debug the file structure before running tests
      - name: Debug migration paths
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Directory structure ==="
          find . -name "migrations" -type d 2>/dev/null || echo "No migrations directory found"
          echo "=== Checking common paths ==="
          ls -la src/ || echo "No src directory"
          ls -la src/database/ || echo "No src/database directory"
          ls -la src/database/migrations/ || echo "No src/database/migrations directory"
          ls -la database/ || echo "No database directory"
          ls -la database/migrations/ || echo "No database/migrations directory"
          echo "=== All migration files ==="
          find . -name "*.js" -path "*/migrations/*" 2>/dev/null || echo "No JS migration files found"
          find . -name "*.ts" -path "*/migrations/*" 2>/dev/null || echo "No TS migration files found"
          find . -name "*.sql" -path "*/migrations/*" 2>/dev/null || echo "No SQL migration files found"

      # Test the migration endpoint directly
      - name: Test migration endpoints directly
        run: |
          echo "=== Testing GET /api/v1/migrations ==="
          curl -v http://127.0.0.1:3000/api/v1/migrations || echo "GET failed"
          echo ""
          echo "=== Testing POST /api/v1/migrations ==="
          curl -v -X POST http://127.0.0.1:3000/api/v1/migrations || echo "POST failed"

      - name: Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          POSTGRES_DATABASE: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          BASE_URL: http://127.0.0.1:3000
          NODE_ENV: test

      - name: Stop application
        run: |
          if [ -f app.pid ]; then
            APP_PID=$(cat app.pid)
            echo "Stopping application with PID: $APP_PID"
            kill $APP_PID || echo "Process already stopped"
            # Wait for graceful shutdown
            sleep 2
            # Force kill if still running
            kill -9 $APP_PID 2>/dev/null || echo "Process already terminated"
            rm app.pid
          fi
        if: always()

      # Optional: Show logs if tests fail
      - name: Show application logs on failure
        if: failure()
        run: |
          echo "=== Checking if application is still running ==="
          ps aux | grep node || echo "No node processes found"
          echo "=== Checking port 3000 ==="
          netstat -tlnp | grep 3000 || echo "Port 3000 not in use"
          echo "=== Recent system logs ==="
          journalctl --since "5 minutes ago" | tail -50 || echo "No recent logs found"
